<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>hey 🖤</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🖤</text></svg>">
<style>
  :root { --paper:#17141a; --ink:#ece6f0; --bubble:#242028; --accent:#b32b6e; --accent-dark:#8f1f57; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body { font-family:"Helvetica Neue", Arial, sans-serif; background:var(--paper); color:var(--ink); overflow:hidden; }
  .chat { position:fixed; inset:0; display:flex; flex-direction:column; justify-content:center; max-width:470px; margin:0 auto; padding:28px 22px; }
  .who { display:flex; align-items:center; gap:12px; margin-bottom:26px; }
  .ava { width:46px; height:46px; border-radius:50%; background:#3a3345; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:20px; }
  .who .name { font-weight:800; font-size:16px; }
  .who .status { font-size:12.5px; opacity:.55; }
  .who .status i { font-style:normal; color:#3cab5a; }
  .bubble { background:var(--bubble); border-radius:20px; border-bottom-left-radius:6px; padding:13px 18px; max-width:88%; margin-bottom:12px; font-size:16.5px; line-height:1.45; opacity:0; transform:translateY(14px) scale(.96); }
  .show { animation:pop .45s cubic-bezier(.34,1.56,.64,1) both; }
  @keyframes pop { from { opacity:0; transform:translateY(14px) scale(.96); } to { opacity:1; transform:none; } }
  .typing { display:inline-flex; gap:5px; align-items:center; background:var(--bubble); border-radius:20px; border-bottom-left-radius:6px; padding:16px 18px; margin-bottom:12px; }
  .typing span { width:7px; height:7px; border-radius:50%; background:#6b6274; animation:blink 1.1s infinite; }
  .typing span:nth-child(2) { animation-delay:.18s; } .typing span:nth-child(3) { animation-delay:.36s; }
  @keyframes blink { 0%,70%,100% { opacity:.3; } 35% { opacity:1; } }
  .photo { padding:8px; background:#201c24; border-radius:16px; transform:rotate(-1.6deg); max-width:246px; margin:4px 0 16px; opacity:0; }
  .photo img { width:100%; height:220px; object-fit:cover; object-position:center 20%; border-radius:10px; display:block; }
  .photo .cap { text-align:center; font-size:14px; padding:6px 2px 2px; opacity:.8; }
  .btn { align-self:flex-start; background:var(--accent); color:#fff0f6; border:none; cursor:pointer; font-size:17px; font-weight:800; padding:16px 34px; border-radius:999px; opacity:0; }
  .btn:hover { background:var(--accent-dark); }
  .ps { margin-top:14px; opacity:0; }
  .fadeout { position:fixed; inset:0; z-index:20; background:#000; opacity:0; pointer-events:none; transition:opacity .45s; }
  .fadeout.on { opacity:1; }
</style>
</head>
<body>

<div class="chat">
  <div class="who">
    <div class="ava">A</div>
    <div><div class="name">YOUR NAME 🖤</div><div class="status"><i>●</i> online</div></div>
  </div>

  <div class="typing" id="typing"><span></span><span></span><span></span></div>

  <div class="bubble" id="b1">okay listen 👀</div>
  <div class="bubble" id="b2">I think I found something u might like&hellip;<br>honestly not like anything else out there 🥹</div>
  <div class="photo" id="ph">
    <img src="photo1.jpg" alt="">
    <div class="cap">look at this vibe ↑</div>
  </div>
  <div class="bubble" id="b3">u might wanna check it out yourself. trust&nbsp;me&nbsp;🤞</div>

  <button class="btn" id="seeBtn" type="button">okay, show me 🖤</button>
  <div class="ps" id="ps">&hellip;you&rsquo;ll thank me later.</div>
</div>

<div class="fadeout" id="fadeout"></div>

<script>
  // КУДА ВЕДЁТ КНОПКА. Меняешь только адрес в кавычках.
  var TARGET_URL = "PASTE_YOUR_LINK_HERE";

  // Сообщения появляются по очереди, как в переписке.
  var steps = ["b1", "b2", "ph", "b3"], typing = document.getElementById("typing"), i = 0;
  function next() {
    if (i >= steps.length) {
      typing.style.display = "none";
      document.getElementById("seeBtn").classList.add("show");
      document.getElementById("ps").classList.add("show");
      return;
    }
    var el = document.getElementById(steps[i]);
    typing.style.display = "none";
    el.classList.add("show");
    el.parentNode.insertBefore(typing, el.nextSibling.nextSibling || null);
    i++;
    if (i < steps.length) setTimeout(function () { typing.style.display = "inline-flex"; }, 250);
    setTimeout(next, 950);
  }
  setTimeout(next, 900);

  document.getElementById("seeBtn").addEventListener("click", function () {
    document.getElementById("fadeout").classList.add("on");
    setTimeout(function () { window.location.href = TARGET_URL; }, 420);
  });
</script>
</body>
</html>
